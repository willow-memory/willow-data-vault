name: Trailers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the reconciler
        run: pip install "willow-reconciler>=0.6.0"
      # `./`, not `.`: willow-reconciler 0.6.0 treats a bare `.` as a repo
      # NAME to look up beside the checkout and exits 2; `./` is a path.
      - name: Verify Idea-Id trailers resolve
        run: reconciler verify --repo ./ --doc docs/ideas.md
